spring.application.name=microcrm

# Base HSQLDB en mode fichier. Le chemin est externalisé pour que le
# conteneur puisse le pointer vers un volume sans reconstruire l'image.
spring.datasource.url=jdbc:hsqldb:file:${MICROCRM_DB_PATH:./data/microcrm};shutdown=true
spring.datasource.username=sa
spring.datasource.password=

# Indispensable : Spring Boot considère HSQLDB comme une base embarquée
# et applique create-drop par défaut, ce qui supprimerait le schéma à
# chaque arrêt, y compris en mode fichier.
spring.jpa.hibernate.ddl-auto=update

# Évite que des requêtes soient déclenchées pendant le rendu de la vue.
spring.jpa.open-in-view=false