name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  back:
    name: Back-end - build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build, test and generate coverage
        run: ./gradlew build

      - name: SonarQube analysis
        run: ./gradlew sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload back-end reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: back-reports
          path: |
            back/build/reports/tests/test
            back/build/reports/jacoco/test
          retention-days: 7

  front:
    name: Front-end - build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    env:
      NG_CLI_ANALYTICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test and generate coverage
        run: npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox

      - name: Build
        run: npx ng build

      - name: SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: front
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload front-end coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: front-coverage
          path: front/coverage/microcrm
          retention-days: 7