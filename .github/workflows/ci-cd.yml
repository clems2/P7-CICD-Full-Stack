name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  back:
    name: Back-end - build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build, test and generate coverage
        run: ./gradlew build

      - name: SonarQube analysis
        run: ./gradlew sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload back-end reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: back-reports
          path: |
            back/build/reports/tests/test
            back/build/reports/jacoco/test
          retention-days: 7

  front:
    name: Front-end - build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    env:
      NG_CLI_ANALYTICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test and generate coverage
        run: npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox

      - name: Build
        run: npx ng build

      - name: SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: front
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload front-end coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: front-coverage
          path: front/coverage/microcrm
          retention-days: 7
  publish:
    name: Publish image
    needs: [back, front]
    # Uniquement sur main : une pull request ne publie rien.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Déclarées ici et non au niveau du workflow : celui-ci se déclenche
    # aussi sur pull_request, où du code non fiable ne doit en aucun cas
    # pouvoir écrire dans le registre.
    permissions:
      contents: read
      packages: write

    # Les deux composants suivent exactement la même procédure ; la
    # matrice évite de dupliquer le bloc d'étapes.
    strategy:
      matrix:
        component: [back, front]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Jeton fourni automatiquement : aucun secret à créer.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/microcrm-${{ matrix.component }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Métadonnées OCI : rattachent l'image au dépôt et au commit
          # dont elle est issue.
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}  